<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iceonline3 · 项目导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0a0a1a;
    color: #e8e8f0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 20px;
    background-image: radial-gradient(circle at 20% 30%, rgba(177,151,252,.08) 0%, transparent 40%),
                      radial-gradient(circle at 80% 70%, rgba(0,212,255,.08) 0%, transparent 40%);
  }
  h1 {
    font-size: 36px; letter-spacing: 2px; margin-bottom: 10px;
    background: linear-gradient(135deg, #00d4ff, #b197fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #8888aa; margin-bottom: 48px; font-size: 14px; letter-spacing: 4px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px; width: 100%; max-width: 780px;
  }
  .card {
    position: relative; display: block; text-decoration: none; color: inherit;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px; padding: 28px 24px; transition: all .25s ease; overflow: hidden;
  }
  .card:hover {
    transform: translateY(-6px); border-color: rgba(0,212,255,.5);
    box-shadow: 0 12px 32px rgba(0,212,255,.15); background: rgba(255,255,255,.06);
  }
  .blocks { display: flex; gap: 4px; margin-bottom: 18px; }
  .blocks span { width: 18px; height: 18px; border-radius: 4px; box-shadow: inset 0 2px 0 rgba(255,255,255,.3); }
  .card h2 { font-size: 20px; margin-bottom: 8px; color: #fff; }
  .card p { font-size: 13.5px; line-height: 1.6; color: #9999bb; margin-bottom: 18px; }
  .card .play { display: inline-block; font-size: 14px; color: #00d4ff; letter-spacing: 1px; }
  .card:hover .play { text-shadow: 0 0 12px rgba(0,212,255,.8); }
  .coming { opacity: .45; pointer-events: none; }
  footer { margin-top: 56px; color: #555577; font-size: 12px; letter-spacing: 1px; }
</style>
</head>
<body>
  <h1>iceonline3 · Projects</h1>
  <div class="subtitle">项目导航</div>
  <div class="grid">
    <a class="card" href="/tetris/">
      <div class="blocks">
        <span style="background:#00d4ff"></span><span style="background:#ffd43b"></span><span style="background:#b197fc"></span><span style="background:#51cf66"></span><span style="background:#ff6b6b"></span>
      </div>
      <h2>俄罗斯方块</h2>
      <p>Tetris 单文件网页游戏：SRS 旋转、7-bag 随机器、投影与 Hold。<br>方向键移动 · Space 硬降 · C 暂存 · P/Enter 暂停。</p>
      <span class="play">开始游玩 →</span>
    </a>
<a class="card" href="/brick-breaker/">
      <div class="blocks">
        <span style="background:#3ddc84"></span><span style="background:#ffd54f"></span><span style="background:#4fc3f7"></span><span style="background:#b388ff"></span><span style="background:#ff7043"></span>
      </div>
      <h2>破砖达人</h2>
      <p>500 关打砖块：50 场景、水晶玻璃砖、BONUS 贪分关、夸张粒子打击感。<br>鼠标/手指移动 · 点击发射 · P 暂停。</p>
      <span class="play">开始游玩 →</span>
    </a>
    <div class="card coming">
      <div class="blocks"><span style="background:#333"></span><span style="background:#333"></span></div>
      <h2>Coming Soon</h2>
      <p>更多项目即将上线…</p>
      <span class="play">—</span>
    </div>
    <div class="card coming">
      <div class="blocks"><span style="background:#333"></span><span style="background:#333"></span></div>
      <h2>Coming Soon</h2>
      <p>更多项目即将上线…</p>
      <span class="play">—</span>
    </div>
  </div>
  <footer>Powered by GitHub Pages · © iceonline3</footer>
</body>
</html>
